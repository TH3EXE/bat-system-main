<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PETO SECURE LOGIN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
    <style>
        /* Estilos específicos para a animação do morcego sem travar */
        .wing-left {
            transform-origin: 85px 100px;
            animation: flapLeft 3s infinite ease-in-out;
        }
        .wing-right {
            transform-origin: 115px 100px;
            animation: flapRight 3s infinite ease-in-out;
        }
        @keyframes flapLeft {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(8deg); }
        }
        @keyframes flapRight {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-8deg); }
        }
        .bat-signal-circle {
            animation: pulseSignal 4s infinite ease-in-out;
        }
        @keyframes pulseSignal {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>
</head>
<body class="login-body"> 

    <div class="login-bg-grid"></div>
    <div class="login-scanline"></div>
    <div class="bat-signal-bg"></div>

    <main class="login-terminal-wrapper">
        <div class="terminal-top-deco">
            <span>SYS://SECURE_BOOT.init</span>
            <div class="deco-leds"><span></span><span></span><span></span></div>
        </div>

        <div class="login-terminal-box">
            <div class="terminal-header">
                <div class="bat-signal-container">
                    <svg class="bat-signal-logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <radialGradient id="batSignalGradient" cx="50%" cy="50%">
                                <stop offset="0%" stop-color="#E8B923" stop-opacity="1"/>
                                <stop offset="40%" stop-color="#E8B923" stop-opacity="0.8"/>
                                <stop offset="70%" stop-color="#E8B923" stop-opacity="0.4"/>
                                <stop offset="100%" stop-color="#E8B923" stop-opacity="0"/>
                            </radialGradient>
                            <filter id="glow">
                                <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        
                        <!-- Fundo do Sinal -->
                        <circle class="bat-signal-circle" cx="100" cy="100" r="75" fill="url(#batSignalGradient)" filter="url(#glow)"/>
                        
                        <!-- Símbolo do Morcego Otimizado -->
                        <g class="bat-symbol" fill="#000" stroke="none">
                            <!-- Asa Esquerda -->
                            <g class="wing-left">
                                <path d="M 85 100 
                                         Q 60 80 40 85 
                                         Q 20 90 10 70 
                                         Q 30 95 50 95 
                                         Q 60 110 85 100 Z" />
                            </g>
                            
                            <!-- Asa Direita -->
                            <g class="wing-right">
                                <path d="M 115 100 
                                         Q 140 80 160 85 
                                         Q 180 90 190 70 
                                         Q 170 95 150 95 
                                         Q 140 110 115 100 Z" />
                            </g>
                            
                            <!-- Corpo e Cabeça -->
                            <path d="M 85 100 
                                     Q 90 120 100 125 
                                     Q 110 120 115 100 
                                     Q 110 90 100 85 
                                     Q 90 90 85 100 Z" />
                            
                            <!-- Orelhas -->
                            <path d="M 92 88 L 88 75 L 96 82 Z" />
                            <path d="M 108 88 L 112 75 L 104 82 Z" />
                        </g>
                    </svg>
                </div>
                <h1>PE<span class="highlight">TO</span></h1>
                <p class="terminal-subtitle">ACESSO RESTRITO | NÍVEL ÔMEGA</p>
                <p class="terminal-subtitle" style="font-size: 0.8rem; text-align: center; white-space: nowrap; letter-spacing: 1px; width: 100%;">PLANEJAMENTO | ESTRATÉGICO | TÁTICO | OPERACIONAL</p>
            </div>

            <form id="login-form" class="terminal-form">
                <div class="input-group-tech">
                    <label for="username">OPERADOR_</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="IDENTIFICAÇÃO..." autocomplete="off">
                        <div class="input-anim-border"></div>
                    </div>
                </div>

                <div class="input-group-tech">
                    <label for="password">SENHA_</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="CODIGO DE ACESSO..." autocomplete="off">
                        <div class="input-anim-border"></div>
                    </div>
                </div>

                <button type="submit" class="btn-access-tech">
                    <span class="btn-text">INICIALIZAR SISTEMA</span>
                    <svg class="btn-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z"/></svg>
                    <div class="btn-glitch-effect"></div>
                </button>
            </form>

            <div class="terminal-footer">
                <div class="status-readout">ENCRIPTAÇÃO: <span style="color:var(--neon-green)">ATIVA</span></div>
                <div class="info-readout">IP: SECURE.TH3.NET // PORT: 666</div>
            </div>
        </div>
    </main>

    <script src="js/global.js"></script>
</body>
</html>
